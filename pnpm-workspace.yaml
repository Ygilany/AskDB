packages:
  - "packages/*"
  - "apps/*"
  - "examples/*"
publicHoistPattern:
  - "*turbo*"
# Transitive-dependency pins we carry ahead of upstream.
#
# deepmerge-ts: `@prisma/config` (via `@prisma/internals`, a runtime dependency of
# `@askdb/prisma`) pins exactly 7.1.5, which is vulnerable to CVE-2026-40345 /
# GHSA-ggr8-5vv4-36mx — `deepmerge()` exhausts the stack on self-referential object
# graphs. v8 adds cycle detection. `@prisma/config` only uses the `deepmerge` named
# export as c12's merger for `prisma.config.ts`, and v8's sole behavioural break for
# plain objects is deep-merging `Map` values, which config objects do not contain.
# Drop this once Prisma ships a release depending on deepmerge-ts >= 8.
overrides:
  deepmerge-ts: ^8.0.2
allowBuilds:
  '@prisma/engines': true
  better-sqlite3: true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
minimumReleaseAge: 720
minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@3.0.130'
  - '@tailwindcss/node@4.3.1'
  - '@tailwindcss/oxide-android-arm64@4.3.1'
  - '@tailwindcss/oxide-darwin-arm64@4.3.1'
  - '@tailwindcss/oxide-darwin-x64@4.3.1'
  - '@tailwindcss/oxide-freebsd-x64@4.3.1'
  - '@tailwindcss/oxide-linux-arm-gnueabihf@4.3.1'
  - '@tailwindcss/oxide-linux-arm64-gnu@4.3.1'
  - '@tailwindcss/oxide-linux-arm64-musl@4.3.1'
  - '@tailwindcss/oxide-linux-x64-gnu@4.3.1'
  - '@tailwindcss/oxide-linux-x64-musl@4.3.1'
  - '@tailwindcss/oxide-wasm32-wasi@4.3.1'
  - '@tailwindcss/oxide-win32-arm64-msvc@4.3.1'
  - '@tailwindcss/oxide-win32-x64-msvc@4.3.1'
  - '@tailwindcss/oxide@4.3.1'
  - '@tailwindcss/vite@4.3.1'
  - ai@6.0.204
  - deslop-js@0.0.24
  - eslint@10.5.0
  - ink@7.0.6
  - oxlint-plugin-react-doctor@0.5.2
  - react-doctor@0.5.2
  - tailwindcss@4.3.1
  - '@ai-sdk/anthropic@4.0.29'
  - '@ai-sdk/azure@4.0.30'
  - '@ai-sdk/deepseek@3.0.21'
  - '@ai-sdk/gateway@4.0.40'
  - '@ai-sdk/google@4.0.33'
  - '@ai-sdk/openai@4.0.29'
  - '@ai-sdk/provider-utils@5.0.20'
  - '@ai-sdk/provider@4.0.5'
  - ai@7.0.51
