packages:
  - "packages/*"
  - "apps/*"
  - "examples/*"
  # The consumer lab is its own pnpm root with its own lockfile; see docs/specs/consumer-lab.md.
  - "!examples/consumer-lab"
  # Shared multi-engine test fixture (replaces Pagila); see fixtures/multi-engine/README.md.
  - "fixtures/multi-engine"
publicHoistPattern:
  - "*turbo*"
# Transitive-dependency pins we carry ahead of upstream.
overrides:
  # Security advisories (GHSA-*) — drop once upstream releases a version with the fix.
  # postcss-selector-parser: GHSA-xh2x-qr4w-9w2m (moderate) — quadratic complexity in flat selector parsing.
  #   Only in apps/docs-site (dev only, not published). Patched in 7.1.6.
  postcss-selector-parser: ^7.1.6
  # source-map-js: GHSA-vh95-rmgr-6w4m (high) — event-loop DoS via indexed source-map section offsets.
  #   Transitive via tailwindcss/vite/postcss (dev only, not published). Patched in 1.2.2.
  source-map-js: ^1.2.2
  # @azure/msal-node: GHSA-xcx6-jx8p-x3h5 (high) — authorization-code flow may disclose parameters to an attacker-controlled endpoint.
  #   Reached through `@azure/identity` under tedious (via mssql, an optional peer of @askdb/sqlserver and Studio that hosts install themselves)
  #   and under astro's unstorage (apps/docs-site only, dev only, not published).
  #   `@azure/identity` 4.14.1 depends on `@azure/msal-node` ^7.1.0 (the patched line), and tedious and unstorage already admit it.
  #   Drop this once tedious raises its own `@azure/identity` floor to 4.14.1.
  "@azure/identity": ^4.14.1
  # minimatch: GHSA-g3hv-75wg-m249 (moderate, Dependabot alert #118) — denial of service via globparts amplification.
  #   Patched in 11.0.1. Dev only: reached through Studio's ESLint toolchain and react-doctor (not published).
  #   eslint 10.14, @eslint/config-array 0.23 and @typescript-eslint/typescript-estree 8.72 still require minimatch ^10;
  #   minimatch 11 keeps the `Minimatch` class and the `minimatch()` function they call. Drop each entry once its parent
  #   accepts ^11.0.1.
  eslint>minimatch: ^11.0.1
  "@eslint/config-array>minimatch": ^11.0.1
  "@typescript-eslint/typescript-estree>minimatch": ^11.0.1
allowBuilds:
  '@prisma/engines': true
  better-sqlite3: true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
minimumReleaseAge: 720
minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@3.0.130'
  - '@tailwindcss/node@4.3.1'
  - '@tailwindcss/oxide-android-arm64@4.3.1'
  - '@tailwindcss/oxide-darwin-arm64@4.3.1'
  - '@tailwindcss/oxide-darwin-x64@4.3.1'
  - '@tailwindcss/oxide-freebsd-x64@4.3.1'
  - '@tailwindcss/oxide-linux-arm-gnueabihf@4.3.1'
  - '@tailwindcss/oxide-linux-arm64-gnu@4.3.1'
  - '@tailwindcss/oxide-linux-arm64-musl@4.3.1'
  - '@tailwindcss/oxide-linux-x64-gnu@4.3.1'
  - '@tailwindcss/oxide-linux-x64-musl@4.3.1'
  - '@tailwindcss/oxide-wasm32-wasi@4.3.1'
  - '@tailwindcss/oxide-win32-arm64-msvc@4.3.1'
  - '@tailwindcss/oxide-win32-x64-msvc@4.3.1'
  - '@tailwindcss/oxide@4.3.1'
  - '@tailwindcss/vite@4.3.1'
  - ai@6.0.204
  - deslop-js@0.0.24
  - eslint@10.5.0
  - ink@7.0.6
  - oxlint-plugin-react-doctor@0.5.2
  - react-doctor@0.5.2
  - tailwindcss@4.3.1
  - '@ai-sdk/anthropic@4.0.29'
  - '@ai-sdk/azure@4.0.30'
  - '@ai-sdk/deepseek@3.0.21'
  - '@ai-sdk/gateway@4.0.40'
  - '@ai-sdk/google@4.0.33'
  - '@ai-sdk/openai@4.0.29'
  - '@ai-sdk/provider-utils@5.0.20'
  - '@ai-sdk/provider@4.0.5'
  - ai@7.0.51
