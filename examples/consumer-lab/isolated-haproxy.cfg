global
  maxconn 100

defaults
  mode tcp
  timeout connect 5s
  timeout client 120s
  timeout server 120s

listen postgres
  bind :5432
  server fixture postgres:5432

listen mysql
  bind :3306
  server fixture mysql:3306

listen mariadb
  bind :3307
  server fixture mariadb:3306

listen sqlserver
  bind :1433
  server fixture sqlserver:1433
