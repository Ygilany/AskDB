# The consumer lab is its own pnpm root with its own lockfile. It is deliberately NOT a
# member of the AskDB monorepo workspace (the root pnpm-workspace.yaml excludes it), so it
# resolves AskDB exactly as an outside project would: from packed tarballs or the registry.
allowBuilds:
  # The host's SQLite driver, and the one `askdb introspect` loads for SQLite; it builds a native addon.
  better-sqlite3: true
  esbuild: true
  # @askdb/prisma's @prisma/engines has a postinstall script pnpm 11 refuses to run unapproved.
  # From #259 askdb only peers @askdb/prisma, so the committed baseline (askdb@1.0.0-rc.1) leaves
  # it out, but a target `lab:use` packs (`.`, a path, `git:<ref>`) still installs it: pnpm
  # installs an optional peer whose override is a `file:` tarball as a dependency. Keep it.
  "@prisma/engines": true
# pnpm 11 holds back versions published less than a day ago (`minimumReleaseAge` defaults
# to 1440 minutes). A just-published AskDB release still installs, since the lab pins it
# exactly, but pnpm then adds every @askdb version to this list itself and rewrites the
# file, indenting the lab:use comments below so `lab:use --restore` can't find them.
minimumReleaseAgeExclude:
  - askdb
  - "@askdb/*"
overrides:
  # Third-party pins, kept across `lab:use` (it rewrites only the marked block below).
  # `pnpm lab:use` rewrites the block below so every @askdb/* package, including transitive
  # ones, resolves to the install target. Don't edit it by hand.
# lab:use overrides begin
# lab:use target: npm:latest
  "@askdb/ai": "1.0.0-rc.1"
  "@askdb/client": "1.0.0-rc.1"
  "@askdb/config": "1.0.0-rc.1"
  "@askdb/core": "1.0.0-rc.1"
  "@askdb/enrich": "0.2.0-rc.1"
  "@askdb/http-api": "1.0.0-rc.1"
  "@askdb/introspect": "1.0.0-rc.1"
  "@askdb/mysql": "1.0.0-rc.1"
  "@askdb/postgres": "1.0.0-rc.1"
  "@askdb/prisma": "1.0.0-rc.1"
  "@askdb/rag": "0.2.0-rc.1"
  "@askdb/sqlite": "1.0.0-rc.1"
  "@askdb/sqlserver": "1.0.0-rc.1"
  "@askdb/studio": "0.2.0-rc.1"
  "askdb": "1.0.0-rc.1"
# lab:use overrides end
