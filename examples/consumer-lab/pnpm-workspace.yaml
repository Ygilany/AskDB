# The consumer lab is its own pnpm root with its own lockfile. It is deliberately NOT a
# member of the AskDB monorepo workspace (the root pnpm-workspace.yaml excludes it), so it
# resolves AskDB exactly as an outside project would: from packed tarballs or the registry.
allowBuilds:
  # The host's SQLite driver, and the one `askdb introspect` loads for SQLite; it builds a native addon.
  better-sqlite3: true
  esbuild: true
  # `askdb` depends on @askdb/prisma, whose @prisma/engines has a postinstall script.
  # pnpm 11 refuses to install until it is approved, as any pnpm user would have to (#259).
  "@prisma/engines": true
overrides:
  # Third-party pins, kept across `lab:use` (it rewrites only the marked block below).
  #
  # deepmerge-ts: `@prisma/config` (via `askdb` > `@askdb/prisma` > `@prisma/internals`)
  # pins exactly 7.1.5, which is vulnerable to GHSA-ggr8-5vv4-36mx (stack exhaustion on
  # self-referential object graphs). Same pin and rationale as the monorepo's
  # pnpm-workspace.yaml; drop both once Prisma ships a release on deepmerge-ts >= 8.
  deepmerge-ts: ^8.0.2
  # `pnpm lab:use` rewrites the block below so every @askdb/* package, including transitive
  # ones, resolves to the install target. Don't edit it by hand.
# lab:use overrides begin
# lab:use target: npm:latest
  "@askdb/ai": "0.1.0-beta.6"
  "@askdb/ai-anthropic": "1.0.0-beta.4"
  "@askdb/ai-azure": "1.0.0-beta.6"
  "@askdb/ai-google": "1.0.0-beta.6"
  "@askdb/ai-openai": "1.0.0-beta.6"
  "@askdb/client": "1.0.0-beta.5"
  "@askdb/config": "1.0.0-beta.11"
  "@askdb/connectors": "0.1.0-beta.7"
  "@askdb/core": "1.0.0-beta.42"
  "@askdb/enrich": "0.2.0-beta.13"
  "@askdb/http-api": "1.0.0-beta.42"
  "@askdb/introspect": "0.3.0-beta.16"
  "@askdb/mysql": "0.1.0-beta.17"
  "@askdb/postgres": "0.2.0-beta.18"
  "@askdb/prisma": "0.2.0-beta.16"
  "@askdb/rag": "0.2.0-beta.22"
  "@askdb/sqlite": "0.1.0-beta.17"
  "@askdb/sqlserver": "0.1.0-beta.18"
  "@askdb/studio": "0.2.0-beta.35"
  "askdb": "1.0.0-beta.42"
# lab:use overrides end
