# The consumer lab is its own pnpm root with its own lockfile. It is deliberately NOT a
# member of the AskDB monorepo workspace (the root pnpm-workspace.yaml excludes it), so it
# resolves AskDB exactly as an outside project would: from packed tarballs or the registry.
allowBuilds:
  # The host's SQLite driver, and the one `askdb introspect` loads for SQLite; it builds a native addon.
  better-sqlite3: true
  esbuild: true
  # Only the committed baseline needs it: askdb@1.0.0-beta.44 depends on @askdb/prisma, whose
  # @prisma/engines has a postinstall script pnpm 11 refuses to run unapproved. From the release
  # that makes @askdb/prisma an optional peer (#259), askdb installs no Prisma package: remove
  # this entry at the first baseline refresh to it (`askdb-no-prisma` checks that install).
  "@prisma/engines": true
# pnpm 11 holds back versions published less than a day ago (`minimumReleaseAge` defaults
# to 1440 minutes). A just-published AskDB release still installs, since the lab pins it
# exactly, but pnpm then adds every @askdb version to this list itself and rewrites the
# file, indenting the lab:use comments below so `lab:use --restore` can't find them.
minimumReleaseAgeExclude:
  - askdb
  - "@askdb/*"
overrides:
  # Third-party pins, kept across `lab:use` (it rewrites only the marked block below).
  #
  # deepmerge-ts: `@prisma/config` (via `@askdb/prisma` > `@prisma/internals`; `askdb` installed it before #259)
  # pins exactly 7.1.5, which is vulnerable to GHSA-ggr8-5vv4-36mx (stack exhaustion on
  # self-referential object graphs). Same pin and rationale as the monorepo's
  # pnpm-workspace.yaml; drop both once Prisma ships a release on deepmerge-ts >= 8.
  deepmerge-ts: ^8.0.2
  # `pnpm lab:use` rewrites the block below so every @askdb/* package, including transitive
  # ones, resolves to the install target. Don't edit it by hand.
# lab:use overrides begin
# lab:use target: npm:latest
  "@askdb/ai": "0.1.0-beta.8"
  "@askdb/client": "1.0.0-beta.7"
  "@askdb/config": "1.0.0-beta.13"
  "@askdb/core": "1.0.0-beta.44"
  "@askdb/enrich": "0.2.0-beta.15"
  "@askdb/http-api": "1.0.0-beta.44"
  "@askdb/introspect": "0.3.0-beta.18"
  "@askdb/mysql": "0.1.0-beta.19"
  "@askdb/postgres": "0.2.0-beta.20"
  "@askdb/prisma": "0.2.0-beta.18"
  "@askdb/rag": "0.2.0-beta.24"
  "@askdb/sqlite": "0.1.0-beta.19"
  "@askdb/sqlserver": "0.1.0-beta.20"
  "@askdb/studio": "0.2.0-beta.37"
  "askdb": "1.0.0-beta.44"
# lab:use overrides end
