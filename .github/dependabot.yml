version: 2

updates:
  # Workflow actions are pinned to full commit SHAs with a `# vX.Y.Z` comment;
  # Dependabot bumps both the SHA and the comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5

  # pnpm workspace: the root directory covers every workspace package via
  # pnpm-workspace.yaml + pnpm-lock.yaml. All non-major bumps land as one PR;
  # majors come as individual PRs so each gets its own review.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # pnpm-workspace.yaml sets `minimumReleaseAge: 720` (12h) and pnpm refuses a
    # lockfile that resolves anything younger, so don't propose brand-new releases.
    cooldown:
      default-days: 1
    # Published ranges move only on purpose (docs/adrs/0015): a bump the range already
    # allows moves only the lockfile, for version and security updates alike. A floor
    # rises by hand, with a changeset that says why.
    versioning-strategy: increase-if-necessary
    # The consumer lab is its own pnpm root with its own lockfile, which this entry doesn't
    # update (it bumped the lab's manifest alone in #402); the entry below covers it.
    # exclude-paths covers version updates only (dependabot-core#14408): a security update
    # from this entry can still edit the lab's manifest, and CI's consumer-lab job fails it.
    exclude-paths:
      - "examples/consumer-lab/**"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  # The consumer lab (examples/consumer-lab/README.md): its third-party pins, with its own
  # lockfile. The ignored packages move on purpose, for version and security updates alike.
  # An advisory against `ai` or `@ai-sdk/openai` still raises a Dependabot alert on the
  # lab's lockfile, the only install of the floor version: the signal to raise the floor.
  - package-ecosystem: npm
    directory: /examples/consumer-lab
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    ignore:
      # The committed baseline is `npm:latest`; `pnpm lab:use npm:latest` refreshes these.
      - dependency-name: "askdb"
      - dependency-name: "@askdb/*"
      # Pinned at AskDB's published floors (docs/adrs/0015); they rise with the floor.
      - dependency-name: "ai"
      - dependency-name: "@ai-sdk/openai"
    groups:
      consumer-lab-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5
