name: Release

# Automated releases with Changesets, gated on CI and the maintainer's approval of the
# Version PR.
#
# Flow (see docs/release.md):
#   1. Feature PRs land on `main` with a changeset (enforced by changesets.yml).
#   2. CI passes on that push, which triggers this workflow. The `version` job opens or
#      updates the "chore: version packages (rc)" PR, which applies every pending
#      changeset (version bumps and CHANGELOG entries). It publishes nothing.
#      `pnpm version-packages` restarts the prerelease counter after a pre-tag change
#      (scripts/prerelease-counter.mjs), so the rc line starts at `1.0.0-rc.1`.
#   3. The maintainer approves that PR. Merging it (by hand or by auto-merge) puts
#      versions on `main` that npm doesn't have yet. Once CI passes on the merge
#      commit, `approved` checks that the commit is that merge, `publish` publishes the
#      versions with no further approval, and `tag` creates their git tags.
#
# Why each piece is shaped this way:
# - `workflow_run` on `CI`, not `push`: publishing only starts after the full CI run
#   (build, lint, the database-backed `test` job, `preflight` with the installable smoke
#   test and a publish dry-run) passed on the exact commit being released. Those checks
#   are not repeated here.
# - Every job checks that the tested commit is still the tip of `main`. changesets/action
#   bases the Version PR commit on `github.sha`, which for `workflow_run` is the newest
#   commit on `main`, not the one CI tested. When `main` has moved on, this run does
#   nothing; the newer commit's CI run triggers the release instead.
# - The release approval is the Version PR review (ADR 0040). CODEOWNERS and the `main`
#   ruleset's code-owner review keep the App-authored Version PR from merging until the
#   maintainer approves it, changesets.yml fails any other PR that adds a public
#   `name@version` npm doesn't have, and `approved` lets only a merged Version PR's
#   merge commit publish. So nothing here asks again. An admin can bypass the ruleset:
#   an admin merge of another PR still can't publish, but an admin merge of the Version
#   PR publishes without the approval.
# - npm auth is trusted publishing (OIDC): no npm token is stored anywhere. Only
#   `publish` has `id-token: write`, and it runs in the `npm-publish` environment
#   (`main` only, no required reviewer). pnpm 11 does the OIDC exchange itself, and adds
#   provenance because the repo and the packages are public. Each package's trusted
#   publisher on npmjs.com must name this file (`release.yml`) and that environment.
# - Prereleases (the betas, now the release candidates) publish under the `latest`
#   dist-tag (`--tag latest`), not the pre tag from `.changeset/pre.json`, so
#   `npm install askdb` gets the newest one (#354). That's why this runs `pnpm -r publish`
#   and not `changeset publish`, which would use the pre tag. OIDC can only publish, so
#   a second tag couldn't be moved afterwards. The 1.0.0 PR changes this to the pre tag
#   while in pre mode (docs/release.md, "Dist-tags").
# - The GitHub App token (`RELEASE_APP_CLIENT_ID` / `RELEASE_APP_PRIVATE_KEY`) opens the
#   Version PR. PRs opened with `GITHUB_TOKEN` don't trigger other workflows, so the
#   required checks would never report on it. The token is minted after
#   `pnpm install`, and the action commits through the GitHub API, so it never sits in
#   the git config.
# - changesets/action is on the v2 line, which needs Changesets CLI v3 (pinned exactly in
#   the root `package.json`). v2 renamed the v1 inputs (`version` → `version-script`,
#   `title` → `pr-title`, `commit` → `commit-message`, `branch` → `pr-base-branch`) and
#   commits through the GitHub API by default (v1's `commitMode: github-api`).
#
# To re-run a failed publish, use "Re-run failed jobs" on the run. `pnpm -r publish`
# skips versions that are already on npm.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

# Never let two releases race, and never cancel one partway: a cancelled publish can
# leave npm and the git tags out of sync.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    # `vars.RELEASE_APP_CLIENT_ID` unset = the one-time setup in docs/release.md isn't
    # done yet; skip instead of failing on every green push to `main`.
    if: >-
      github.repository == 'Ygilany/AskDB' &&
      vars.RELEASE_APP_CLIENT_ID != '' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.unpublished.outputs.packages }}
      publish: ${{ steps.unpublished.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Find versions not yet on npm
        id: unpublished
        run: |
          packages="$(node scripts/release-unpublished.mjs)"
          echo "packages=${packages}" >> "$GITHUB_OUTPUT"
          if [ "${packages}" = "[]" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Every public package's version is already on npm; nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "To publish: ${packages}"
          fi

      - name: Mint the release App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Opens or updates the Version PR when changesets are pending; otherwise a no-op.
      # No `publish` input: publishing is the `publish` job's alone.
      - name: Open or update the Version PR
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version-script: pnpm version-packages
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          pr-base-branch: main
          create-github-releases: false

  # `publish` ships every version npm doesn't have, built from this commit. changesets.yml
  # keeps every PR but the Version PR from adding such a version, but when a Version PR's
  # merge commit gets no release run (its CI failed, or a later PR merged before CI
  # finished), a later commit would publish the approved versions with its own code. So
  # `publish` runs only from a merged Version PR's merge commit (ADR 0040). A refused run
  # fails here and publishes nothing; docs/release.md says how to publish those versions.
  approved:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Check that this commit is a merged Version PR's merge
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/check-version-pr-merge.mjs "${SHA}"

  publish:
    needs: [version, approved]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # What npm's trusted-publishing docs require (Node >= 22.14, npm >= 11.5.1,
          # registry-url). pnpm does the OIDC exchange itself, but this keeps the job
          # on the documented setup.
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r build

      # CI's `preflight` job already ran the smoke test and the dry-run on this commit;
      # they aren't repeated here, to keep third-party code out of the job that can publish.
      - name: Publish to npm
        run: pnpm -r publish --access public --no-git-checks --tag latest --report-summary

      - name: Published packages
        if: always()
        run: cat pnpm-publish-summary.json 2>/dev/null || echo "no publish summary"

  tag:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Same `<name>@<version>` annotated tags `changeset tag` creates. Tags pushed with
      # GITHUB_TOKEN trigger no workflows.
      - name: Tag the published versions
        env:
          PACKAGES: ${{ needs.version.outputs.packages }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "${PACKAGES}" | jq -r '.[] | "\(.name)@\(.version)"' | while read -r tag; do
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
              echo "${tag}: already tagged"
              continue
            fi
            git tag -a "${tag}" -m "${tag}"
            git push origin "refs/tags/${tag}"
          done
