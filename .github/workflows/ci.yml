name: CI

on:
  push:
    branches: [main]
  pull_request:

# Latest wins on every ref, `main` included: a newer push cancels the older run. Only the
# tip of `main` can release (release.yml acts only when the commit CI tested is still the
# tip), so an older run's result is never used. Without cancelling, the group keeps one
# pending run and drops it for the next push anyway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 0. Changes ────────────────────────────────────────────────────────────
  # What changed, for the jobs that skip work: `docs_only` (PRs only; docs-only
  # PRs skip test, the unit tests, preflight, consumer-lab and e2e), `deps`
  # (audit runs only when a dependency file changed) and `smoke_input` (a docs
  # file preflight's smoke test reads changed). The rules and the cases that
  # run everything are in scripts/ci-changes.sh.
  #
  # The filters are job-level `if:`s, not a workflow-level `paths:`: a skipped
  # job reports success, so a required check never waits on a skipped job
  # (see changesets.yml). Each `if:` skips only on an explicit `true`/`false`
  # from here, and uses `!cancelled()`, so a failed `changes` runs everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      deps: ${{ steps.changes.outputs.deps }}
      smoke_input: ${{ steps.changes.outputs.smoke_input }}
    steps:
      # Full history: a push diffs against `github.event.before`, a PR against its base.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Self-test the change rules
        run: bash scripts/ci-changes.test.sh

      - name: Detect what changed
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          FORCED: ${{ github.event.forced }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            bash scripts/ci-changes.sh pr "$BASE_REF" | tee -a "$GITHUB_OUTPUT"
          else
            bash scripts/ci-changes.sh push "$BEFORE" "$AFTER" "$FORCED" | tee -a "$GITHUB_OUTPUT"
          fi

  # ── 1. Build ──────────────────────────────────────────────────────────────
  # Compiles all packages, writing each build to Turbo's remote cache. No job
  # waits for it: each one builds what it uses (turbo's `lint`, `test` and `e2e`
  # tasks depend on the builds they need; `pnpm smoke:install` and
  # `pnpm lab:use .` build before packing), so they all start at once.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turbo's remote cache, kept in this repo's Actions cache as one entry per task hash (key
      # `turbogha_<hash>`). The action starts a local server that speaks Turbo's remote cache API
      # and exports TURBO_API, TURBO_TOKEN and TURBO_TEAM for later steps; its post step stops it.
      # Turbo looks up each task when it reaches it and uploads each task that succeeds (failed
      # tasks are never cached), so a job downloads only what it uses and writes only what changed.
      # No entry grows: one GitHub hasn't served for 7 days expires.
      # - build, lint and test write. preflight, consumer-lab and e2e only read: they rebuild what
      #   build builds. unit-node-matrix has no remote cache, on purpose.
      # - Access: the action gets the job's Actions runtime token, which reads this repo's caches and
      #   writes the current ref's (a pull request's entries stay in that pull request). A fork's
      #   pull request gets the same token, so the cache works there too. No secret is involved.
      # - If the server can't start, turbo runs without a remote cache (continue-on-error).
      # - When two jobs build the same changed package at once, both upload it and the second
      #   upload logs a "Cache not saved" warning. It is harmless: the first upload is the entry.
      - name: Set up Turbo's remote cache
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
        continue-on-error: true

      - name: Build all packages
        run: pnpm build

  # ── 1b. Lint ──────────────────────────────────────────────────────────────
  # oxlint over the whole repo (root `.oxlintrc.json`, warnings fail), then every
  # package's `lint` task: `tsc --noEmit` for the libraries/apps, plus Studio's
  # `tsconfig.web.json` typecheck and the docs site's `astro check`. None of
  # these run anywhere else in CI. `lint` depends on `^build`, so turbo builds
  # (or replays from its cache) what each package imports.
  #
  # On docs-only PRs, where `test` doesn't run, it also runs the tests that read
  # docs: the docs site's own suite (its build, links and prose checks) and the
  # CLI's, which check the Quickstart page and the ADRs its help text names.
  # `!cancelled()`: if `changes` fails, lint still runs (a skipped required check
  # would pass).
  lint:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Reads and writes Turbo's remote cache; see the build job. A package whose lint inputs
      # haven't changed replays its last passing lint.
      - name: Set up Turbo's remote cache
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
        continue-on-error: true

      - name: Lint + typecheck
        run: pnpm lint

      # Called directly, not through turbo: the CLI's test hash doesn't cover the docs it
      # reads, so turbo would replay a cached pass. Its spawn tests run dist/cli.js.
      - name: Docs tests (docs-only pull requests)
        if: needs.changes.outputs.docs_only == 'true'
        run: |
          pnpm -C apps/docs-site test
          pnpm exec turbo run build --filter=askdb
          pnpm -C apps/cli test

  # ── 1c. Dependency audit ──────────────────────────────────────────────────
  # `audit-ci` over `pnpm audit`, failing on moderate+ advisories. Allowlisted
  # advisories live in .audit-ci.json; each one needs a written rationale in
  # CONTRIBUTING.md ("Dependency Audit").
  #
  # Runs only when a dependency file changed (`changes`' `deps` output), so a new
  # advisory against an existing dependency doesn't turn every PR red. The daily
  # audit-scheduled.yml run catches those on `main`. The filter is a job-level
  # `if:`: `audit` is a required check, and a skipped job reports success. It
  # runs unless `changes` said `deps=false`, so a failed detection still audits.
  audit:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.deps != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm run audit

  # ── 1d. Supported Node versions ───────────────────────────────────────────
  # The published libraries declare `engines.node >=22.23.4`; this proves the
  # unit suites build and pass on Node 22 (the floor), 24 (Maintenance LTS)
  # and 26 (Active LTS). It is a clean build (no Turbo cache) so the build
  # itself runs on each version. Keep it uncached: it is also the backstop for a
  # cached `test` whose turbo.json inputs miss a file the tests read.
  # Integration suites skip here: no DB URLs are set, and
  # ASKDB_REQUIRE_INTEGRATION is deliberately NOT set — the `test` job below
  # owns integration coverage (on Node 22) so DB services aren't paid for twice.
  #
  # Docs-only PRs skip its steps, not the job. A matrix job skipped by a job-level
  # `if:` reports one check under the unexpanded name, never the three required
  # `unit (Node N)` checks, which then stay pending (actions/runner#952). Running
  # the job with every step skipped reports each of them as a success.
  unit-node-matrix:
    name: unit (Node ${{ matrix.node }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - name: Docs-only pull request
        if: env.DOCS_ONLY == 'true'
        run: echo "Docs-only pull request; skipping the unit tests (lint runs the docs tests)."

      - name: Checkout
        if: env.DOCS_ONLY != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        if: env.DOCS_ONLY != 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        if: env.DOCS_ONLY != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Node version
        if: env.DOCS_ONLY != 'true'
        run: node --version

      - name: Install dependencies
        if: env.DOCS_ONLY != 'true'
        run: pnpm install --frozen-lockfile

      # Each package's vitest run records its counts in ASKDB_TEST_SUMMARY_DIR
      # (scripts/test-utils/summary-reporter.mjs); the next step renders one table.
      - name: Build + unit tests
        if: env.DOCS_ONLY != 'true'
        run: pnpm test
        env:
          ASKDB_TEST_SUMMARY_DIR: ${{ runner.temp }}/test-summary

      - name: Test summary
        if: always() && env.DOCS_ONLY != 'true'
        env:
          ASKDB_TEST_SUMMARY_DIR: ${{ runner.temp }}/test-summary
          TITLE: Unit tests (Node ${{ matrix.node }})
        run: node scripts/test-summary.mjs "$TITLE" >> "$GITHUB_STEP_SUMMARY"

  # ── 2. Test ───────────────────────────────────────────────────────────────
  # Runs unit + integration tests. Turbo replays build outputs from cache so
  # packages are not rebuilt. DB services start in parallel with job setup.
  # Docs-only PRs skip it (a skipped job reports success); lint runs the docs
  # tests there. `!= 'true'`: a failed `changes` job still runs it.
  test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest

    services:
      # pgvector/pgvector is stock Postgres 16 plus the `vector` extension, so the same
      # service backs both the plain Postgres suite (DATABASE_URL) and the pgvector suites
      # in @askdb/rag and Studio (ASKDB_PGVECTOR_URL). A step below creates the extension
      # before the tests run.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: askdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: "AskDB.123"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'AskDB.123' -Q 'SELECT 1' -b -C"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 18
          --health-start-period 90s

    # Turbo runs in strict env mode: these reach vitest only because turbo.json lists
    # them in the `test` task's `env`. Add new integration env vars there too.
    env:
      # Integration suites FAIL (instead of silently skipping) when a URL is missing.
      ASKDB_REQUIRE_INTEGRATION: "1"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/askdb_test
      ASKDB_PGVECTOR_URL: postgres://postgres:postgres@localhost:5432/askdb_test
      # Multi-engine fixture (fixtures/multi-engine): Postgres, MySQL, MariaDB, SQL Server, SQLite.
      ASKDB_FIXTURE_HOST: 127.0.0.1
      MSSQL_DATABASE_URL: "Server=127.0.0.1,1433;Database=askdb_test;User Id=sa;Password=AskDB.123;Encrypt=false"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Reads and writes Turbo's remote cache; see the build job. A package whose test inputs
      # (turbo.json `test`: its files, fixtures, the env above) haven't changed replays its last
      # passing run, and the test summary lists it as cached.
      - name: Set up Turbo's remote cache
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
        continue-on-error: true

      - name: Create SQL Server test database
        run: >-
          docker exec
          $(docker ps -q --filter "ancestor=mcr.microsoft.com/mssql/server:2022-latest")
          /opt/mssql-tools18/bin/sqlcmd
          -S localhost -U sa -P 'AskDB.123'
          -Q "IF DB_ID('askdb_test') IS NULL CREATE DATABASE askdb_test"
          -C

      # Both pgvector suites run CREATE EXTENSION IF NOT EXISTS, which Postgres doesn't
      # serialize: when turbo runs the two packages' tests at once, one can fail on a duplicate
      # pg_extension key. With the extension already there, both statements are no-ops.
      - name: Create the pgvector extension
        run: >-
          docker exec
          "$(docker ps -q --filter "ancestor=pgvector/pgvector:pg16")"
          psql -U postgres -d askdb_test
          -c "CREATE EXTENSION IF NOT EXISTS vector"

      - name: Start and seed the multi-engine fixture
        run: pnpm fixture:up

      - name: Run unit + integration tests
        run: pnpm test
        env:
          ASKDB_TEST_SUMMARY_DIR: ${{ runner.temp }}/test-summary

      - name: Test summary
        if: always()
        env:
          ASKDB_TEST_SUMMARY_DIR: ${{ runner.temp }}/test-summary
        run: node scripts/test-summary.mjs "Unit + integration tests" >> "$GITHUB_STEP_SUMMARY"

  # ── 3. Preflight ──────────────────────────────────────────────────────────
  # Release smoke test + publish dry-run. Runs in parallel with `test` so
  # packaging failures surface without waiting for the full DB test suite.
  # smoke:install builds the packages through Turbo, which replays unchanged
  # builds from the remote cache.
  #
  # Docs-only PRs skip it, unless they change a file the smoke test reads: a
  # package's README.md (it ships in the tarball, and the smoke test checks its
  # links) or the Quickstart page (quickstart-example.sh runs its steps).
  preflight:
    needs: changes
    if: >-
      ${{ !cancelled() && (needs.changes.outputs.docs_only != 'true' ||
      needs.changes.outputs.smoke_input == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # smoke:install builds through Turbo (scripts/pack-tarballs.sh runs `pnpm build`), so it
      # replays builds from Turbo's remote cache. Read-only; see the build job.
      - name: Set up Turbo's remote cache
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
        continue-on-error: true

      - name: Read Turbo's remote cache without writing to it
        run: echo "TURBO_CACHE=local:rw,remote:r" >> "$GITHUB_ENV"

      # The release scripts: the prerelease counter (`pnpm version-packages` in the Version
      # PR), the unpublished-version guard (changesets.yml) and the Version PR merge check
      # (release.yml's `approved` job).
      - name: Self-test the release scripts
        run: node --test scripts/prerelease-counter.test.mjs scripts/check-unpublished-versions.test.mjs scripts/check-version-pr-merge.test.mjs

      - name: Installable smoke test
        run: pnpm smoke:install

      # @askdb/ai peers `ai` and each @ai-sdk/* package with wide floors; run its
      # tests (contract tests included) with every peer installed at its floor.
      - name: "@askdb/ai tests at the AI SDK peer floors"
        run: pnpm test:ai-floors

      # Packs what's in each package's dist/, which `pnpm smoke:install` above built.
      - name: Validate publish (dry-run)
        run: pnpm -r publish --dry-run --no-git-checks --access=public

  # ── 4. Consumer lab ───────────────────────────────────────────────────────
  # Packs this commit's publishable packages into tarballs, installs them into
  # examples/consumer-lab (its own pnpm root, outside the workspace) and runs
  # the lab's scenario × dialect matrix against the multi-engine fixture.
  #
  # The matrix runs as two shards, each on its own runner with its own fixture:
  # one vitest run saturates a 4-vCPU runner, and the lab's MatrixSequencer
  # (examples/consumer-lab/src/matrix-shards.ts) splits the files by their CI
  # cost. Each shard uploads .lab/matrix.shard-<i>.json; the `consumer-lab` job
  # merges them into .lab/matrix.json, prints the table to the job summary and
  # fails on any FAIL cell, a failed or missing shard, or a failed shard or
  # safety-proofs job (`consumer-lab (safety proofs)` runs beside the shards).
  # It passes on pass / n/a / known. `consumer-lab` keeps the required check's name.
  #
  # Docs-only PRs skip it, by `changes`' `docs_only` output (job 0).
  consumer-lab-shard:
    name: consumer-lab (shard ${{ matrix.shard }}/2)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      ASKDB_FIXTURE_HOST: 127.0.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # The lab's committed package.json and pnpm-lock.yaml must agree. Dependabot's root
      # entry skips the lab for version updates only (exclude-paths; dependabot-core#14408),
      # so a root security update can still bump a lab pin without the lab's lockfile, as
      # #402 did. Revert that PR's change to the lab's package.json: the lab's own Dependabot
      # entry proposes the lab's bumps with its lockfile (docs/adrs/0015).
      - name: Check the lab's lockfile matches its manifest
        run: pnpm -C examples/consumer-lab install --frozen-lockfile --lockfile-only

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `lab:use .` builds through Turbo (scripts/pack-tarballs.sh runs `pnpm build`), so it
      # replays builds from Turbo's remote cache. Read-only; see the build job.
      - name: Set up Turbo's remote cache
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
        continue-on-error: true

      - name: Read Turbo's remote cache without writing to it
        run: echo "TURBO_CACHE=local:rw,remote:r" >> "$GITHUB_ENV"

      - name: Pack this commit's tarballs and install them in the lab
        run: pnpm lab:use .

      # lab:up starts and seeds the fixture, starts the lab's own Postgres (tenant-rls seeds it),
      # then keeps the install above. The shard prints its own table and writes
      # .lab/matrix.shard-<i>.json; the `consumer-lab` job merges the shards.
      - name: Run the consumer lab matrix (shard ${{ matrix.shard }}/2)
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm lab:matrix "--shard=${SHARD}/2"

      - name: Upload the shard's matrix
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consumer-lab-matrix-shard-${{ matrix.shard }}
          path: examples/consumer-lab/.lab/matrix.shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          # .lab/ is a dot-directory, which upload-artifact skips by default.
          include-hidden-files: true

  # The safety cases' effect proofs (#323), on a disposable second fixture (compose project
  # askdb-lab-isolated, ports 25432/23306/23307/21433). The runner starts, seeds, tests and
  # removes it, including after a failure. About a minute, on its own runner so it runs beside
  # the shards instead of after one of them.
  consumer-lab-safety:
    name: consumer-lab (safety proofs)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Read-only, like the shards; see the build job.
      - name: Set up Turbo's remote cache
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
        continue-on-error: true

      - name: Read Turbo's remote cache without writing to it
        run: echo "TURBO_CACHE=local:rw,remote:r" >> "$GITHUB_ENV"

      - name: Pack this commit's tarballs and install them in the lab
        run: pnpm lab:use .

      - name: Prove the safety cases' effects on an isolated fixture copy
        run: pnpm lab:safety:isolated

  # Merges the shards (`pnpm lab:matrix:merge`, run with plain Node: it imports only Node's
  # built-ins, so this job needs no install).
  # It runs whenever the shards ran, pass or fail, so the merged table always lands in the
  # job summary; a missing shard file fails the merge (exit 2), not silently passes.
  consumer-lab:
    needs: [changes, consumer-lab-shard, consumer-lab-safety]
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Download the shards' matrices
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: consumer-lab-matrix-shard-*
          path: lab-shards

      - name: Merge the shards into one matrix
        run: node examples/consumer-lab/src/matrix-merge.mjs lab-shards

      - name: Upload the matrix
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consumer-lab-matrix
          path: examples/consumer-lab/.lab/matrix.json
          if-no-files-found: warn
          # .lab/ is a dot-directory, which upload-artifact skips by default.
          include-hidden-files: true

      # A shard can fail outside the matrix (install, lab:use) and still upload a clean shard
      # file, and the safety proofs write no matrix, so the merge alone isn't the verdict.
      - name: Fail if a shard or the safety proofs failed
        if: ${{ needs.consumer-lab-shard.result != 'success' || needs.consumer-lab-safety.result != 'success' }}
        env:
          SHARDS: ${{ needs.consumer-lab-shard.result }}
          SAFETY: ${{ needs.consumer-lab-safety.result }}
        run: |
          echo "::error::consumer-lab shards: ${SHARDS}; safety proofs: ${SAFETY}"
          exit 1

  # ── 5. verify-askdb replays ──────────────────────────────────────────────
  # The scripted journeys of verify-askdb's feature map (e2e/): the askdb CLI and HTTP API
  # under Vitest, Studio under Playwright, each in a disposable project with a fake model.
  # Docs-only PRs skip it, by the same filter as the consumer lab. Evidence and Playwright's
  # report are uploaded, pass or fail.
  e2e:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm e2e` builds what the replays drive (`e2e` depends on `^build`) and replays those
      # builds from Turbo's remote cache. Read-only; see the build job.
      - name: Set up Turbo's remote cache
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
        continue-on-error: true

      - name: Read Turbo's remote cache without writing to it
        run: echo "TURBO_CACHE=local:rw,remote:r" >> "$GITHUB_ENV"

      # Chromium is cached per Playwright version, which pins its browser build. The
      # version comes from the installed CLI: the lockfile also holds other playwright-core
      # versions. The system libraries aren't cached, so a hit still installs them.
      - name: Find the Playwright version
        id: playwright
        run: |
          version="$(pnpm -C e2e exec playwright --version | awk '{print $NF}')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "Unexpected Playwright version: '$version'" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright's Chromium
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright's Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm -C e2e exec playwright install --with-deps chromium

      # Saved right after the install, so a failing replay doesn't throw the download away.
      - name: Save Playwright's Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - name: Install Chromium's system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm -C e2e exec playwright install-deps chromium

      # The runner context isn't available in a job-level env, so the evidence root is set here.
      - name: Run the replays
        env:
          ASKDB_VERIFY_ROOT: ${{ runner.temp }}/askdb-verify
        run: pnpm e2e

      - name: Upload evidence and the Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-evidence
          path: |
            ${{ runner.temp }}/askdb-verify
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: warn

  # ── 6. Bound-forms deep run ──────────────────────────────────────────────
  # The property check that every executable form of a statement binds each tenant ID and
  # value into its own slot (.agents/skills/verify-bound-forms). `pnpm test` runs it at 300
  # cases on every PR. When a PR touches the code it covers, or the check itself, this job
  # runs it at 20000 cases and then the mutants, which prove the check can still fail.
  # `covered.mjs` decides; it runs on every PR, so the job always reports a status and a
  # PR that touches nothing covered skips only the slow steps. Pushes to main always run it.
  bound-forms:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Detector self-test
        run: node --test .agents/skills/verify-bound-forms/covered.test.mjs

      # Exit 0: nothing covered changed. Exit 3: covered code or the check changed. Anything
      # else is the detector failing, which fails the job instead of skipping the deep run.
      - name: Does this change touch covered code?
        id: covered
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "deep=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=0
          node .agents/skills/verify-bound-forms/covered.mjs --base "origin/${BASE_REF}" || status=$?
          case "$status" in
            0) echo "deep=false" >> "$GITHUB_OUTPUT"; echo "Nothing the bound-forms check covers changed; skipping the deep run." ;;
            3) echo "deep=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "covered.mjs exited $status" >&2; exit 1 ;;
          esac

      - name: Install dependencies
        if: steps.covered.outputs.deep == 'true'
        run: pnpm install --frozen-lockfile

      - name: Bound-forms check at 20000 cases
        if: steps.covered.outputs.deep == 'true'
        env:
          ASKDB_VERIFY_RUNS: "20000"
        run: .agents/skills/verify-bound-forms/run.sh

      - name: Mutants (every break must be caught)
        if: steps.covered.outputs.deep == 'true'
        run: node .agents/skills/verify-bound-forms/mutants.mjs
