name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel stale PR runs; never cancel in-progress main pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── 1. Build ──────────────────────────────────────────────────────────────
  # Compiles all packages and seeds the Turbo cache for downstream jobs.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build all packages
        run: pnpm build

  # ── 1b. Lint ──────────────────────────────────────────────────────────────
  # Every package's `lint` task: `tsc --noEmit` for the libraries/apps, plus
  # Studio's eslint + `tsconfig.web.json` typecheck and the docs site's
  # `astro check`. None of these run anywhere else in CI. Turbo replays the
  # upstream `build` outputs (`lint` depends on `^build`) from the cache.
  # The root `lint` script first runs scripts/check-test-gating.mjs (and its
  # node --test suite), which rejects hand-rolled test gates (`describe.skip`,
  # `? describe :`) in every workspace package's tests in favor of
  # integrationSuite().
  lint:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Lint + typecheck
        run: pnpm lint

  # ── 1c. Dependency audit ──────────────────────────────────────────────────
  # `audit-ci` over `pnpm audit`, failing on moderate+ advisories. Allowlisted
  # advisories live in .audit-ci.json; each one needs a written rationale in
  # CONTRIBUTING.md ("Dependency audit"). Independent of the build.
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm run audit

  # ── 1d. Supported Node versions ───────────────────────────────────────────
  # The published libraries declare `engines.node >=22.12`; this proves the
  # floor and the current LTS both build and pass the unit suites. It is a
  # clean build (no Turbo cache) so the build itself runs on each version.
  # Integration suites skip here: no DB URLs are set, and
  # ASKDB_REQUIRE_INTEGRATION is deliberately NOT set — the `test` job below
  # owns integration coverage (on Node 22) so DB services aren't paid for twice.
  unit-node-matrix:
    name: unit (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.12.0", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm 11 itself needs Node >=22.13, so use the standalone build (bundles
      # its own Node runtime); scripts still run on the matrix Node below.
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Node version
        run: node --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build + unit tests
        run: pnpm test

  # ── 2. Test ───────────────────────────────────────────────────────────────
  # Runs unit + integration tests. Turbo replays build outputs from cache so
  # packages are not rebuilt. DB services start in parallel with job setup.
  test:
    needs: build
    runs-on: ubuntu-latest

    services:
      # pgvector/pgvector is stock Postgres 16 plus the `vector` extension, so the same
      # service backs both the plain Postgres suite (DATABASE_URL) and the @askdb/rag
      # pgvector suite (ASKDB_PGVECTOR_URL; the test runs CREATE EXTENSION itself).
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: askdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: askdb_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -pmysql"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 30s

      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: "AskDB.123"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'AskDB.123' -Q 'SELECT 1' -b -C"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 18
          --health-start-period 90s

    # Turbo runs in strict env mode: these reach vitest only because turbo.json lists
    # them in the `test` task's `env`. Add new integration env vars there too.
    env:
      # Integration suites FAIL (instead of silently skipping) when a URL is missing.
      ASKDB_REQUIRE_INTEGRATION: "1"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/askdb_test
      ASKDB_PGVECTOR_URL: postgres://postgres:postgres@localhost:5432/askdb_test
      # Multi-engine fixture (fixtures/multi-engine): Postgres, MySQL, MariaDB, SQL Server, SQLite.
      ASKDB_FIXTURE_HOST: 127.0.0.1
      MYSQL_DATABASE_URL: mysql://root:mysql@127.0.0.1:3306/askdb_test
      MSSQL_DATABASE_URL: "Server=127.0.0.1,1433;Database=askdb_test;User Id=sa;Password=AskDB.123;Encrypt=false"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Create SQL Server test database
        run: >-
          docker exec
          $(docker ps -q --filter "ancestor=mcr.microsoft.com/mssql/server:2022-latest")
          /opt/mssql-tools18/bin/sqlcmd
          -S localhost -U sa -P 'AskDB.123'
          -Q "IF DB_ID('askdb_test') IS NULL CREATE DATABASE askdb_test"
          -C

      - name: Start and seed the multi-engine fixture
        run: pnpm fixture:up

      - name: Run unit + integration tests
        run: pnpm test

  # ── 3. Preflight ──────────────────────────────────────────────────────────
  # Release smoke test + publish dry-run. Runs in parallel with `test` so
  # packaging failures surface without waiting for the full DB test suite.
  # smoke:install rebuilds packages internally; turbo cache is restored as a
  # safety net for any direct `pnpm build` calls.
  preflight:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Installable smoke test
        run: pnpm smoke:install

      - name: Validate publish (dry-run)
        run: pnpm -r publish --dry-run --no-git-checks --access=public

  # ── 4. Consumer lab ───────────────────────────────────────────────────────
  # Packs this commit's publishable packages into tarballs, installs them into
  # examples/consumer-lab (its own pnpm root, outside the workspace) and runs
  # the lab's scenario × dialect matrix against the multi-engine fixture. The
  # job fails on any FAIL cell (the matrix reporter sets the exit code) and
  # passes on pass / n/a / known. The table lands in the job summary and
  # .lab/matrix.json is uploaded, pass or fail.
  #
  # Docs-only PRs skip it. The filter is a job-level `if:` on `lab-changes`,
  # not a workflow-level `paths:`: a skipped job reports success, so this check
  # can be made required without blocking docs-only PRs (see changesets.yml).
  lab-changes:
    runs-on: ubuntu-latest
    outputs:
      lab: ${{ steps.changes.outputs.lab }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Docs-only = every changed file is under apps/docs-site/, docs/ or plans/,
      # a top-level *.md, or a README.md / CHANGELOG.md. Other Markdown is not
      # docs-only: schema artifacts (fixtures/schemas/**, lab overlays) are .md.
      - name: Detect docs-only pull requests
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "lab=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          if [ -n "$changed" ] && ! printf '%s\n' "$changed" \
            | grep -Eqv '^(apps/docs-site/|docs/|plans/)|^[^/]+\.md$|(^|/)(README|CHANGELOG)\.md$'; then
            echo "lab=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only pull request; skipping the consumer lab."
          else
            echo "lab=true" >> "$GITHUB_OUTPUT"
          fi

  consumer-lab:
    needs: [build, lab-changes]
    if: needs.lab-changes.outputs.lab == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASKDB_FIXTURE_HOST: 127.0.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Pack this commit's tarballs and install them in the lab
        run: pnpm lab:use .

      # lab:up starts and seeds the fixture, then keeps the install above.
      - name: Run the consumer lab matrix
        run: pnpm lab:matrix

      - name: Upload the matrix
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consumer-lab-matrix
          path: examples/consumer-lab/.lab/matrix.json
          if-no-files-found: warn
          # .lab/ is a dot-directory, which upload-artifact skips by default.
          include-hidden-files: true
