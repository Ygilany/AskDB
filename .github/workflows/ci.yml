name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel stale PR runs; never cancel in-progress main pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── 1. Build ──────────────────────────────────────────────────────────────
  # Compiles all packages and seeds the Turbo cache for downstream jobs.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build all packages
        run: pnpm build

  # ── 1b. Lint ──────────────────────────────────────────────────────────────
  # oxlint over the whole repo (root `.oxlintrc.json`, warnings fail), then every
  # package's `lint` task: `tsc --noEmit` for the libraries/apps, plus Studio's
  # `tsconfig.web.json` typecheck and the docs site's `astro check`. None of
  # these run anywhere else in CI. Turbo replays the
  # upstream `build` outputs (`lint` depends on `^build`) from the cache.
  lint:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Lint + typecheck
        run: pnpm lint

  # ── 1c. Dependency audit ──────────────────────────────────────────────────
  # `audit-ci` over `pnpm audit`, failing on moderate+ advisories. Allowlisted
  # advisories live in .audit-ci.json; each one needs a written rationale in
  # CONTRIBUTING.md ("Dependency audit"). Independent of the build.
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm run audit

  # ── 1d. Supported Node versions ───────────────────────────────────────────
  # The published libraries declare `engines.node >=22.23.4`; this proves the
  # unit suites build and pass on Node 22 (the floor), 24 (Maintenance LTS)
  # and 26 (Active LTS). It is a clean build (no Turbo cache) so the build
  # itself runs on each version.
  # Integration suites skip here: no DB URLs are set, and
  # ASKDB_REQUIRE_INTEGRATION is deliberately NOT set — the `test` job below
  # owns integration coverage (on Node 22) so DB services aren't paid for twice.
  unit-node-matrix:
    name: unit (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Node version
        run: node --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Each package's vitest run records its counts in ASKDB_TEST_SUMMARY_DIR
      # (scripts/test-utils/summary-reporter.mjs); the next step renders one table.
      - name: Build + unit tests
        run: pnpm test
        env:
          ASKDB_TEST_SUMMARY_DIR: ${{ runner.temp }}/test-summary

      - name: Test summary
        if: always()
        env:
          ASKDB_TEST_SUMMARY_DIR: ${{ runner.temp }}/test-summary
          TITLE: Unit tests (Node ${{ matrix.node }})
        run: node scripts/test-summary.mjs "$TITLE" >> "$GITHUB_STEP_SUMMARY"

  # ── 2. Test ───────────────────────────────────────────────────────────────
  # Runs unit + integration tests. Turbo replays build outputs from cache so
  # packages are not rebuilt. DB services start in parallel with job setup.
  test:
    needs: build
    runs-on: ubuntu-latest

    services:
      # pgvector/pgvector is stock Postgres 16 plus the `vector` extension, so the same
      # service backs both the plain Postgres suite (DATABASE_URL) and the pgvector suites
      # in @askdb/rag and Studio (ASKDB_PGVECTOR_URL). A step below creates the extension
      # before the tests run.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: askdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: "AskDB.123"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'AskDB.123' -Q 'SELECT 1' -b -C"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 18
          --health-start-period 90s

    # Turbo runs in strict env mode: these reach vitest only because turbo.json lists
    # them in the `test` task's `env`. Add new integration env vars there too.
    env:
      # Integration suites FAIL (instead of silently skipping) when a URL is missing.
      ASKDB_REQUIRE_INTEGRATION: "1"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/askdb_test
      ASKDB_PGVECTOR_URL: postgres://postgres:postgres@localhost:5432/askdb_test
      # Multi-engine fixture (fixtures/multi-engine): Postgres, MySQL, MariaDB, SQL Server, SQLite.
      ASKDB_FIXTURE_HOST: 127.0.0.1
      MSSQL_DATABASE_URL: "Server=127.0.0.1,1433;Database=askdb_test;User Id=sa;Password=AskDB.123;Encrypt=false"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Create SQL Server test database
        run: >-
          docker exec
          $(docker ps -q --filter "ancestor=mcr.microsoft.com/mssql/server:2022-latest")
          /opt/mssql-tools18/bin/sqlcmd
          -S localhost -U sa -P 'AskDB.123'
          -Q "IF DB_ID('askdb_test') IS NULL CREATE DATABASE askdb_test"
          -C

      # Both pgvector suites run CREATE EXTENSION IF NOT EXISTS, which Postgres doesn't
      # serialize: when turbo runs the two packages' tests at once, one can fail on a duplicate
      # pg_extension key. With the extension already there, both statements are no-ops.
      - name: Create the pgvector extension
        run: >-
          docker exec
          "$(docker ps -q --filter "ancestor=pgvector/pgvector:pg16")"
          psql -U postgres -d askdb_test
          -c "CREATE EXTENSION IF NOT EXISTS vector"

      - name: Start and seed the multi-engine fixture
        run: pnpm fixture:up

      - name: Run unit + integration tests
        run: pnpm test
        env:
          ASKDB_TEST_SUMMARY_DIR: ${{ runner.temp }}/test-summary

      - name: Test summary
        if: always()
        env:
          ASKDB_TEST_SUMMARY_DIR: ${{ runner.temp }}/test-summary
        run: node scripts/test-summary.mjs "Unit + integration tests" >> "$GITHUB_STEP_SUMMARY"

  # ── 3. Preflight ──────────────────────────────────────────────────────────
  # Release smoke test + publish dry-run. Runs in parallel with `test` so
  # packaging failures surface without waiting for the full DB test suite.
  # smoke:install rebuilds packages internally; turbo cache is restored as a
  # safety net for any direct `pnpm build` calls.
  preflight:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # The release scripts: the prerelease counter (`pnpm version-packages` in the Version
      # PR), the unpublished-version guard (changesets.yml) and the Version PR merge check
      # (release.yml's `approved` job).
      - name: Self-test the release scripts
        run: node --test scripts/prerelease-counter.test.mjs scripts/check-unpublished-versions.test.mjs scripts/check-version-pr-merge.test.mjs

      - name: Installable smoke test
        run: pnpm smoke:install

      # @askdb/ai peers `ai` and each @ai-sdk/* package with wide floors; run its
      # tests (contract tests included) with every peer installed at its floor.
      - name: "@askdb/ai tests at the AI SDK peer floors"
        run: pnpm test:ai-floors

      - name: Validate publish (dry-run)
        run: pnpm -r publish --dry-run --no-git-checks --access=public

  # ── 4. Consumer lab ───────────────────────────────────────────────────────
  # Packs this commit's publishable packages into tarballs, installs them into
  # examples/consumer-lab (its own pnpm root, outside the workspace) and runs
  # the lab's scenario × dialect matrix against the multi-engine fixture. The
  # job fails on any FAIL cell (the matrix reporter sets the exit code) and
  # passes on pass / n/a / known. The table lands in the job summary and
  # .lab/matrix.json is uploaded, pass or fail.
  #
  # Docs-only PRs skip it. The filter is a job-level `if:` on `lab-changes`,
  # not a workflow-level `paths:`: a skipped job reports success, so this check
  # can be made required without blocking docs-only PRs (see changesets.yml).
  lab-changes:
    runs-on: ubuntu-latest
    outputs:
      lab: ${{ steps.changes.outputs.lab }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Docs-only = every changed file is under apps/docs-site/ or docs/,
      # a top-level *.md, or a README.md / CHANGELOG.md. Other Markdown is not
      # docs-only: schema artifacts (fixtures/schemas/**, lab overlays) are .md.
      - name: Detect docs-only pull requests
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "lab=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          if [ -n "$changed" ] && ! printf '%s\n' "$changed" \
            | grep -Eqv '^(apps/docs-site/|docs/)|^[^/]+\.md$|(^|/)(README|CHANGELOG)\.md$'; then
            echo "lab=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only pull request; skipping the consumer lab."
          else
            echo "lab=true" >> "$GITHUB_OUTPUT"
          fi

  consumer-lab:
    needs: [build, lab-changes]
    if: needs.lab-changes.outputs.lab == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASKDB_FIXTURE_HOST: 127.0.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # The lab's committed package.json and pnpm-lock.yaml must agree. Dependabot's root
      # entry skips the lab for version updates only (exclude-paths; dependabot-core#14408),
      # so a root security update can still bump a lab pin without the lab's lockfile, as
      # #402 did. Revert that PR's change to the lab's package.json: the lab's own Dependabot
      # entry proposes the lab's bumps with its lockfile (docs/adrs/0015).
      - name: Check the lab's lockfile matches its manifest
        run: pnpm -C examples/consumer-lab install --frozen-lockfile --lockfile-only

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Pack this commit's tarballs and install them in the lab
        run: pnpm lab:use .

      # lab:up starts and seeds the fixture, starts the lab's own Postgres (tenant-rls seeds it),
      # then keeps the install above.
      - name: Run the consumer lab matrix
        run: pnpm lab:matrix

      # The safety cases' effect proofs (#323), on a disposable second fixture (compose project
      # askdb-lab-isolated, ports 25432/23306/23307/21433), never the shared one started above.
      # The runner starts, seeds, tests and removes it, including after a failure. About a minute.
      - name: Prove the safety cases' effects on an isolated fixture copy
        run: pnpm lab:safety:isolated

      - name: Upload the matrix
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consumer-lab-matrix
          path: examples/consumer-lab/.lab/matrix.json
          if-no-files-found: warn
          # .lab/ is a dot-directory, which upload-artifact skips by default.
          include-hidden-files: true

  # ── 5. verify-askdb replays ──────────────────────────────────────────────
  # The scripted journeys of verify-askdb's feature map (e2e/): the askdb CLI and HTTP API
  # under Vitest, Studio under Playwright, each in a disposable project with a fake model.
  # Docs-only PRs skip it, by the same filter as the consumer lab. Evidence and Playwright's
  # report are uploaded, pass or fail.
  e2e:
    needs: [build, lab-changes]
    if: needs.lab-changes.outputs.lab == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install Playwright's Chromium
        run: pnpm -C e2e exec playwright install --with-deps chromium

      # The runner context isn't available in a job-level env, so the evidence root is set here.
      - name: Run the replays
        env:
          ASKDB_VERIFY_ROOT: ${{ runner.temp }}/askdb-verify
        run: pnpm e2e

      - name: Upload evidence and the Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-evidence
          path: |
            ${{ runner.temp }}/askdb-verify
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: warn

  # ── 6. Bound-forms deep run ──────────────────────────────────────────────
  # The property check that every executable form of a statement binds each tenant ID and
  # value into its own slot (.agents/skills/verify-bound-forms). `pnpm test` runs it at 300
  # cases on every PR. When a PR touches the code it covers, or the check itself, this job
  # runs it at 20000 cases and then the mutants, which prove the check can still fail.
  # `covered.mjs` decides; it runs on every PR, so the job always reports a status and a
  # PR that touches nothing covered skips only the slow steps. Pushes to main always run it.
  bound-forms:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Detector self-test
        run: node --test .agents/skills/verify-bound-forms/covered.test.mjs

      # Exit 0: nothing covered changed. Exit 3: covered code or the check changed. Anything
      # else is the detector failing, which fails the job instead of skipping the deep run.
      - name: Does this change touch covered code?
        id: covered
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "deep=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=0
          node .agents/skills/verify-bound-forms/covered.mjs --base "origin/${BASE_REF}" || status=$?
          case "$status" in
            0) echo "deep=false" >> "$GITHUB_OUTPUT"; echo "Nothing the bound-forms check covers changed; skipping the deep run." ;;
            3) echo "deep=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "covered.mjs exited $status" >&2; exit 1 ;;
          esac

      - name: Install dependencies
        if: steps.covered.outputs.deep == 'true'
        run: pnpm install --frozen-lockfile

      - name: Bound-forms check at 20000 cases
        if: steps.covered.outputs.deep == 'true'
        env:
          ASKDB_VERIFY_RUNS: "20000"
        run: .agents/skills/verify-bound-forms/run.sh

      - name: Mutants (every break must be caught)
        if: steps.covered.outputs.deep == 'true'
        run: node .agents/skills/verify-bound-forms/mutants.mjs
