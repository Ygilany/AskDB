name: Changesets

# Validate that any PR touching publishable sources includes a changeset entry.
# Publishing itself remains a maintainer step (see release.yml).
on:
  pull_request:
    paths:
      - "packages/*/src/**"
      - "packages/*/package.json"
      - "apps/cli/src/**"
      - "apps/cli/package.json"
      - "apps/http-api/src/**"
      - "apps/http-api/package.json"
      - "apps/studio/src/**"
      - "apps/studio/package.json"

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify a changeset is present for this PR
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
