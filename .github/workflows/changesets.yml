name: Changesets

# Validate that any PR touching publishable sources includes a changeset entry.
# Publishing is automated in release.yml (see docs/release.md).
#
# Runs on every PR (no workflow-level `paths:` filter) so the `status` check
# always reports and can be a required status check in the `main` ruleset.
# A path-filtered workflow never reports on docs- or CI-only PRs, which leaves
# a required check pending forever. The path filter lives in the first step.
on:
  pull_request:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The Version PR that release.yml opens applies the pending changesets, so it
      # changes every bumped package.json but adds no changeset, and
      # `changeset status --since` fails on it by design. Skip the check there (the job
      # still reports success). Only a branch pushed to this repo counts, not a fork's.
      # Dependabot dependency-only PRs change manifests and the lockfile but do not
      # carry changesets; continue to require changesets if their diff includes other files.
      - name: Detect changes to publishable sources
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
          IS_VERSION_PR: ${{ github.head_ref == 'changeset-release/main' && github.event.pull_request.head.repo.full_name == github.repository }}
          IS_DEPENDABOT_PR: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: |
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          if [ "${IS_VERSION_PR}" = "true" ]; then
            echo "publishable=false" >> "$GITHUB_OUTPUT"
            echo "Version PR: its changesets are already applied; no new changeset required."
          elif [ "${IS_DEPENDABOT_PR}" = "true" ] \
            && [ -n "${changed}" ] \
            && ! printf '%s\n' "${changed}" \
              | grep -Eqv '(^|/)(package\.json|pnpm-lock\.yaml)$'; then
            echo "publishable=false" >> "$GITHUB_OUTPUT"
            echo "Dependabot dependency-only pull request; no changeset required."
          elif printf '%s\n' "${changed}" \
            | grep -Eq '^packages/[^/]+/(src/|package\.json$)|^apps/(cli|http-api|studio)/(src/|package\.json$)'; then
            echo "publishable=true" >> "$GITHUB_OUTPUT"
          else
            echo "publishable=false" >> "$GITHUB_OUTPUT"
            echo "No publishable sources changed; no changeset required."
          fi

      - if: steps.changes.outputs.publishable == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - if: steps.changes.outputs.publishable == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - if: steps.changes.outputs.publishable == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify a changeset is present for this PR
        if: steps.changes.outputs.publishable == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm changeset status --since="origin/${BASE_REF}"
